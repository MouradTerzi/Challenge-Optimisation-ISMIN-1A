<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Challenge Optimisation 2026{% endblock %}</title>

    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f5f5f5;
        }

        main {
            flex: 1 0 auto;
        }

        nav {
            background-color: #1565C0;
        }

        footer.page-footer {
            background-color: #1565C0;
        }
    </style>
    {% block styles %}{% endblock %}
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-wrapper container">
            <a href="/" class="brand-logo">
                <i class="material-icons">emoji_events</i>
                Challenge 2026
            </a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Accueil</a></li>
                <li><a href="/equipes/ajouter/">Ajouter une équipe</a></li>
                <li><a href="/solutions/soumettre/">Soumettre</a></li>
                <li><a href="/classement/">Classement</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenu -->
    <main>
        <div class="container" style="margin-top: 40px; margin-bottom: 40px;">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="page-footer">
        <div class="container">
            <p class="white-text center-align" style="margin: 15px 0;">
                © 2026 Challenge Optimisation
            </p>
        </div>
    </footer>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    {% block scripts %}{% endblock %}

</body>

</html>
